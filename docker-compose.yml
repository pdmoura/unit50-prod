# Local development database. Production uses the hosted database in DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unit50
      POSTGRES_PASSWORD: unit50
      POSTGRES_DB: unit50
    ports:
      - "127.0.0.1:54350:5432"
    volumes:
      - db:/var/lib/postgresql/data
volumes:
  db:

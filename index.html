<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16372d" />
    <meta
      name="description"
      content="Unit 50 — local residential prospecting in Weber County."
    />
    <title>Unit 50 · Fieldwork</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The loading screen is styled here so it shows before the app's files arrive. -->
    <style>
      /* Large screens: from about 1760px wide the whole interface grows with
         the screen (every size in the stylesheets is in rem, see
         vite.config.ts). The height limit keeps wide, short screens usable. */
      html {
        font-size: clamp(16px, min(100vw / 110, 100vh / 56), 40px);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #16372d;
        perspective: 700px;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash svg {
        width: 68px;
        height: auto;
        color: #f2f6e8;
        animation: splash-spin 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotateY(360deg);
        }
      }
      @keyframes splash-pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: splash-pulse 1.4s ease-in-out infinite alternate;
        }
      }
    </style>
  </head>
